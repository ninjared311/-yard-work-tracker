<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yard Work Tracker</title>
<style>
body{margin:0;background:#e8eee9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173126}.app{max-width:390px;min-height:844px;margin:auto;background:#fff;position:relative}.status{height:32px;padding:8px 16px 0;font-weight:700;display:flex;justify-content:space-between}header{background:#167447;color:white;padding:16px;display:flex;align-items:center}header h1{flex:1;margin:0;font-size:21px}.back{background:none;border:0;color:#fff;font-size:25px}.main{padding:16px 15px 85px}.stats,.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats{grid-template-columns:repeat(3,1fr)}.stat,.cat,.card{border-radius:14px;padding:14px}.stat{text-align:center;background:#f2f7f3}.stat b{display:block;font-size:22px}.cat{border:0;color:#fff;text-align:left;min-height:85px;font-weight:800}.mow{background:#2d8757}.weed{background:#479b55}.eat{background:#e97722}.other{background:#66727a}.cat small{display:block;margin-top:6px}.card{border:1px solid #dfe8e2;margin:8px 0}.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e7eee9}.row:last-child{border:0}.grow{flex:1}.row small{display:block;color:#718078;margin-top:4px;font-size:11px}.btn{border:0;border-radius:8px;padding:7px 9px;font-weight:700}.green{background:#167447;color:white}.edit{background:#eef7f1;color:#167447}.del{background:#fff0f0;color:#bd3b3b}.nav{position:absolute;bottom:0;left:0;right:0;height:68px;background:white;border-top:1px solid #dfe8e2;display:flex;justify-content:space-around}.nav button{border:0;background:none;color:#68736d}.nav .active{color:#167447;font-weight:800}.nav i{display:block;font-style:normal;font-size:20px}.fab{position:absolute;right:17px;bottom:80px;border:0;border-radius:50%;width:52px;height:52px;background:#167447;color:#fff;font-size:28px}.sheetbg{display:none;position:absolute;inset:0;background:#0006;align-items:flex-end}.sheet{background:white;border-radius:24px 24px 0 0;padding:20px;width:100%;box-sizing:border-box}.sheet input,.sheet select,.sheet textarea{width:100%;padding:11px;margin:6px 0 13px;border:1px solid #dfe8e2;border-radius:9px;box-sizing:border-box}.save{width:100%;padding:13px;background:#167447;color:#fff;border:0;border-radius:10px;font-weight:800}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6b3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yard Work">
<link rel="apple-touch-icon" href="icon-192.png">
</head><body><div class="app"><div class="status"><span>9:41</span><span>●●● ▰</span></div><div id="screen"></div><div class="nav"><button class="active" onclick="home()"><i>⌂</i>Home</button><button onclick="manage()"><i>☑</i>Tasks</button><button onclick="calendar()"><i>▦</i>Calendar</button><button onclick="mapView()"><i>⌖</i>Yard Map</button></div><button class="fab" onclick="addTask()">+</button><div class="sheetbg" id="bg" onclick="closeSheet(event)"><div class="sheet" id="sheet"></div></div></div>
<script>
let tasks=[["Mowing","Front Lawn","Weekly"],["Mowing","Back Lawn","Weekly"],["Mowing","Side Yard","Every 2 weeks"],["Weeding","Garden Beds","Weekly"],["Weeding","Around Shrubs","Every 2 weeks"],["Weed Eating","Around House","Weekly"],["Weed Eating","Fence Lines","Every 2 weeks"],["Other","Trim Shrubs","Monthly"],["Other","Clean Gutters","Seasonal"],["Other","Leaf Cleanup","Fall"]],done=new Set();
const ic={Mowing:"🚜",Weeding:"🌿","Weed Eating":"✂️",Other:"🔧"};
function head(x,b=true){return `<header>${b?'<button class="back" onclick="home()">‹</button>':''}<h1>${x}</h1></header>`}
function row(t,i){return `<div class="row"><span class="grow"><b>${ic[t[0]]} ${t[1]}</b><small>${t[0]} · ${t[2]}</small></span><button class="btn edit" onclick="edit(${i})">Edit</button><button class="btn green" onclick="complete(${i})">${done.has(i)?"✓":"Done"}</button></div>`}
function home(){document.getElementById("screen").innerHTML=head("YARD WORK",false)+`<div class="main"><p style="color:#718078">Monday, September 21, 2026</p><div class="stats"><div class="stat"><b>3</b>Due Today</div><div class="stat"><b>5</b>Upcoming</div><div class="stat"><b>${done.size}</b>Completed</div></div><h2>Categories</h2><div class="cats">${["Mowing","Weeding","Weed Eating","Other"].map(c=>`<button class="cat ${c=="Mowing"?"mow":c=="Weeding"?"weed":c=="Weed Eating"?"eat":"other"}" onclick="category('${c}')">${ic[c]} ${c}<small>${tasks.filter(t=>t[0]==c).length} tasks</small></button>`).join("")}</div><h2>Due Today</h2><div class="card">${tasks.slice(0,3).map((t,i)=>row(t,i)).join("")}</div></div>`}
function category(c){document.getElementById("screen").innerHTML=head(c)+`<div class="main"><h2>${ic[c]} ${c}</h2><div class="card">${tasks.map((t,i)=>[t,i]).filter(x=>x[0][0]==c).map(x=>row(x[0],x[1])).join("")}</div></div>`}
function manage(){document.getElementById("screen").innerHTML=head("Manage Tasks")+`<div class="main"><p style="color:#718078">Add, edit, or remove your yard-work duties.</p>${["Mowing","Weeding","Weed Eating","Other"].map(c=>`<div class="card"><h3>${ic[c]} ${c} <button class="btn green" onclick="addTask('${c}')">＋ Add</button></h3>${tasks.map((t,i)=>[t,i]).filter(x=>x[0][0]==c).map(x=>row(x[0],x[1])).join("")}</div>`).join("")}</div>`}
function addTask(c="Mowing"){form(-1,[c,"","Weekly"])} function edit(i){form(i,tasks[i])}
function form(i,t){document.getElementById("sheet").innerHTML=`<button class="btn" onclick="closeSheet()">×</button><h2>${i<0?"Add Task":"Edit Task"}</h2><label>Task Name</label><input id="n" value="${t[1]}" placeholder="e.g. Front flower bed"><label>Category</label><select id="c">${["Mowing","Weeding","Weed Eating","Other"].map(x=>`<option ${x==t[0]?"selected":""}>${x}</option>`).join("")}</select><label>Repeat</label><select id="r">${["Weekly","Every 2 weeks","Monthly","Seasonal","Spring & Fall","As needed"].map(x=>`<option ${x==t[2]?"selected":""}>${x}</option>`).join("")}</select><button class="save" onclick="save(${i})">SAVE TASK</button>`;document.getElementById("bg").style.display="flex"}
function save(i){let t=[c.value,n.value.trim(),r.value];if(!t[1])return;if(i<0)tasks.push(t);else tasks[i]=t;closeSheet();manage()} function complete(i){done.add(i);home()} function closeSheet(e){if(!e||e.target.id=="bg")bg.style.display="none"}
function calendar(){document.getElementById("screen").innerHTML=head("Calendar")+`<div class="main"><div class="card"><h3>September 2026</h3><p>14  15  16  17  18  <b>19</b>  20</p><p><b>21</b> 22  23  24  25  26  27</p></div><h2>Upcoming Tasks</h2><div class="card">${tasks.slice(0,6).map((t,i)=>row(t,i)).join("")}</div></div>`}
function mapView(){document.getElementById("screen").innerHTML=head("Yard Map")+`<div class="main"><div style="height:470px;border-radius:17px;background:linear-gradient(145deg,#b9d3aa,#dce7c8);position:relative"><b style="position:absolute;left:36%;bottom:10%">Front Lawn</b><b style="position:absolute;right:12%;top:10%">Back Lawn</b><b style="position:absolute;left:8%;top:30%">Side Yard</b><b style="position:absolute;right:7%;top:55%">Garden Beds</b></div></div>`}
home();
</script></div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body></html>
