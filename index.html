<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yard Work Tracker</title>
<style>
body{margin:0;background:#e8eee9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173126}.app{max-width:390px;min-height:844px;margin:auto;background:#fff;position:relative}.status{height:32px;padding:8px 16px 0;font-weight:700;display:flex;justify-content:space-between}header{background:#167447;color:#fff;padding:16px 20px;display:flex;align-items:center}header h1{flex:1;margin:0;font-size:21px}.back{background:none;border:0;color:#fff;font-size:25px}.main{padding:16px 15px 85px}.stats,.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat,.cat,.card{border-radius:14px;padding:14px}.stat{text-align:center;background:#f2f7f3}.stat b{display:block;font-size:22px}.cat{border:0;color:#fff;text-align:left;min-height:85px;font-weight:800}.mow{background:#2d8757}.weed{background:#479b55}.eat{background:#e9772f}.other{background:#66727a}.cat small{display:block;margin-top:6px}.card{border:1px solid #dfe8e2;margin:8px 0}.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e7eee9}.row:last-child{border:0}.grow{flex:1}.row-title{display:flex;align-items:center;gap:8px;font-weight:800}.row small{display:block;color:#718078;margin-top:4px;font-size:11px}.task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{display:inline-flex;align-items:center;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:700;background:#eef7f1;color:#1a5d3a}.chip.warn{background:#fff1df;color:#9a5c00}.chip.done{background:#e3f6e8;color:#0d6b3c}.btn{border:0;border-radius:8px;padding:7px 9px;font-weight:700}.green{background:#167447;color:#fff}.edit{background:#eef7f1;color:#167447}.del{background:#fff0f0;color:#bd3b3b}.secondary{background:#f3f5f4;color:#3f4b44}.nav{position:absolute;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid #dfe8e2;display:flex;justify-content:space-around}.nav button{border:0;background:none;color:#68736d}.nav .active{color:#167447;font-weight:800}.nav i{display:block;font-style:normal;font-size:20px}.fab{position:absolute;right:17px;bottom:80px;border:0;border-radius:50%;width:52px;height:52px;background:#167447;color:#fff;font-size:28px}.sheetbg{display:none;position:absolute;inset:0;background:rgba(0,0,0,.2);align-items:flex-end}.sheet{background:#fff;border-radius:24px 24px 0 0;padding:20px;width:100%;box-sizing:border-box}.sheet input,.sheet select,.sheet textarea{width:100%;padding:11px;margin:6px 0 13px;border:1px solid #dfe8e2;border-radius:9px;box-sizing:border-box}.save{width:100%;padding:13px;background:#167447;color:#fff;border:0;border-radius:10px;font-weight:800}.muted{color:#718078}.add-inline{float:right;margin-top:-3px}.task-icon{display:inline-flex;align-items:center;justify-content:center;min-width:18px;vertical-align:middle}.task-icon svg{display:block}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6b3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yard Work">
<link rel="apple-touch-icon" href="icon-192.png">
</head><body><div class="app"><div class="status"><span>9:41</span><span>●●● ▰</span></div><div id="screen"></div><div class="nav"><button class="active" onclick="home()"><i>⌂</i>Home</button><button onclick="manage()"><i>☑</i>Tasks</button><button onclick="calendar()"><i>📅</i>Calendar</button><button onclick="mapView()"><i>🗺</i>Yard Map</button></div><button class="fab" onclick="addTask()">+</button><div class="sheetbg" id="bg" onclick="closeSheet(event)"><div class="sheet" id="sheet"></div></div></div>
<script>
const defaultTasks=[["Mowing","Front Lawn","Weekly"],["Mowing","Back Lawn","Weekly"],["Mowing","Side Yard","Every 2 weeks"],["Weeding","Garden Beds","Weekly"],["Weeding","Around Shrubs","Every 2 weeks"],["Weed Eating","Around House","Weekly"],["Weed Eating","Fence Lines","Every 2 weeks"],["Other","Trim Shrubs","Monthly"],["Other","Clean Gutters","Seasonal"],["Other","Leaf Cleanup","Fall"]];
let tasks=loadTasks(), done=loadDone();
let activeView='home';
function normalizeTask(task){
  const value=Array.isArray(task)?task:["Other","","Weekly"];
  const normalized=[value[0]||"Other",value[1]||"",value[2]||"Weekly"];
  normalized.push(value[3]||"");
  normalized.push(value[4]||"");
  return normalized;
}
function loadTasks(){
  try{
    const x=localStorage.getItem("yardWorkTasks");
    const parsed=x?JSON.parse(x):defaultTasks.map(t=>[...t]);
    return Array.isArray(parsed)?parsed.map(normalizeTask):defaultTasks.map(t=>[...t]);
  }catch(e){
    return defaultTasks.map(t=>[...t]);
  }
}
function loadDone(){
  try{return new Set(JSON.parse(localStorage.getItem("yardWorkDone")||"[]"));}catch(e){return new Set();}}
function persist(){
  localStorage.setItem("yardWorkTasks",JSON.stringify(tasks.map(normalizeTask)));
  localStorage.setItem("yardWorkDone",JSON.stringify([...done]));
}
const ic={Mowing:"custom",Weeding:"🌿","Weed Eating":"✂️",Other:"🔧"};
function mowerIcon(){
  return `<span class="task-icon" aria-label="Red lawn mower" title="Red lawn mower"><svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img"><rect x="3" y="10" width="12" height="7" rx="2" fill="#d62c2c"/><rect x="13" y="12" width="5" height="5" rx="1.5" fill="#b71919"/><rect x="7" y="5" width="4" height="5" rx="1" fill="#d62c2c"/><rect x="11" y="7" width="3" height="2" rx="1" fill="#f6d5d5"/><circle cx="7" cy="18" r="2.5" fill="#1e1e1e"/><circle cx="17" cy="18" r="2.5" fill="#1e1e1e"/><rect x="2" y="9" width="2.5" height="2" rx="1" fill="#3b3b3b"/><path d="M15 8L19 4" stroke="#2c2c2c" stroke-width="1.8" stroke-linecap="round"/><circle cx="20" cy="4" r="1.5" fill="#8a8a8a"/></svg></span>`;
}
function displayIcon(label){
  if(label === "Mowing") return mowerIcon();
  return ic[label] || "🔧";
}
function dateToISO(date){
  const year=date.getFullYear();
  const month=String(date.getMonth()+1).padStart(2,"0");
  const day=String(date.getDate()).padStart(2,"0");
  return `${year}-${month}-${day}`;
}
function parseDate(value){
  if(!value) return null;
  const date=new Date(value);
  return Number.isNaN(date.getTime())?null:date;
}
function formatDate(value){
  const date=parseDate(value);
  if(!date) return "";
  return date.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function formatDueDate(value){
  const date=parseDate(value);
  if(!date) return "";
  return date.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function addDays(date,days){
  const copy=new Date(date); copy.setDate(copy.getDate()+days); return copy;
}
function addMonths(date,months){
  const copy=new Date(date); copy.setMonth(copy.getMonth()+months); return copy;
}
function getNextDueDate(task,completedDate){
  const repeat=(task[2]||"Weekly").toLowerCase();
  const base=parseDate(completedDate)||new Date();
  if(!base) return "";
  switch(repeat){
    case "weekly": return dateToISO(addDays(base,7));
    case "every 2 weeks": return dateToISO(addDays(base,14));
    case "monthly": return dateToISO(addMonths(base,1));
    case "seasonal":
    case "spring & fall": return dateToISO(addMonths(base,6));
    case "as needed":
    case "fall":
    case "spring":
      return "";
    default: return "";
  }
}
function getTaskStatus(task){
  const last=task[3]; const next=task[4];
  if(!last && !next) return "New task";
  if(last && !next) return `Last completed ${formatDate(last)}`;
  if(next){
    const dueDate=parseDate(next);
    const today=new Date();
    const diff=Math.ceil((dueDate-today)/(1000*60*60*24));
    if(diff <= 0) return "Due today";
    if(diff === 1) return "Due tomorrow";
    return `Due in ${diff} days`;
  }
  return "Ready";
}
function renderCurrentView(){
  if(activeView==='manage') return manage();
  if(activeView==='calendar') return calendar();
  if(activeView==='map') return mapView();
  return home();
}
function head(x,b=true){return `<header>${b?'<button class="back" onclick="home()">‹</button>':''}<h1>${x}</h1></header>`}
function row(t,i){
  const itemIcon=displayIcon(t[0]);
  const lastCompleted=t[3] ? `<span class="chip">Last: ${formatDate(t[3])}</span>` : "";
  const nextDue=t[4] ? `<span class="chip ${done.has(i)?"done":"warn"}">Next: ${formatDueDate(t[4])}</span>` : "";
  const status=done.has(i)?'<span class="chip done">Completed</span>':'<span class="chip">'+getTaskStatus(t)+'</span>';
  const doneBtn=done.has(i) ? '<button class="btn secondary" onclick="undoComplete('+i+')">Undo</button>' : '<button class="btn green" onclick="complete('+i+')">Done</button>';
  return `<div class="row"><span class="grow"><div class="row-title"><span class="task-icon">${itemIcon}</span><span>${t[1]}</span></div><small>${t[0]} · ${t[2]}</small><div class="task-meta">${status}${lastCompleted}${nextDue}</div></span><button class="btn edit" onclick="edit(${i})">Edit</button>${doneBtn}</div>`;
}
function home(){
  activeView='home';
  const completedCount=done.size;
  const dueSoonCount=tasks.filter((t,i)=>!done.has(i) && t[4]).length;
  document.getElementById("screen").innerHTML=head("YARD WORK",false)+`<div class="main"><p style="color:#718078">Monday, September 21, 2026</p><div class="stats"><div class="stat"><b>${dueSoonCount}</b>Due Soon</div><div class="stat"><b>${tasks.length}</b>Total Tasks</div><div class="stat"><b>${completedCount}</b>Completed</div></div><h2>Categories</h2><div class="cats">${["Mowing","Weeding","Weed Eating","Other"].map(c=>`<button class="cat ${c=="Mowing"?"mow":c=="Weeding"?"weed":c=="Weed Eating"?"eat":"other"}" onclick="category('${c}')">${displayIcon(c)} ${c}<small>${tasks.filter(t=>t[0]==c).length} tasks</small></button>`).join("")}</div><h2>Due Today</h2><div class="card">${tasks.map((t,i)=>[t,i]).filter(x=>!done.has(x[1]) && x[0][4]).slice(0,3).map(x=>row(x[0],x[1])).join("") || '<p class="muted">No tasks due right now.</p>'}</div></div>`;
}
function category(c){
  activeView='category';
  document.getElementById("screen").innerHTML=head(c)+`<div class="main"><h2>${displayIcon(c)} ${c}</h2><div class="card">${tasks.map((t,i)=>[t,i]).filter(x=>x[0][0]==c).map(x=>row(x[0],x[1])).join("")}</div></div>`;
}
function manage(){
  activeView='manage';
  document.getElementById("screen").innerHTML=head("Manage Tasks")+`<div class="main"><p style="color:#718078">Add, edit, or remove your yard-work duties.</p>${["Mowing","Weeding","Weed Eating","Other"].map(c=>`<div class="card"><h3>${displayIcon(c)} ${c}<button class="btn green add-inline" onclick="addTask('${c}')">Add</button></h3>${tasks.map((t,i)=>[t,i]).filter(x=>x[0][0]==c).map(x=>row(x[0],x[1])).join("")}</div>`).join("")}</div>`;
}
function addTask(c="Mowing"){form(-1,[c,"","Weekly"])}
function edit(i){form(i,tasks[i])}
function form(i,t){
  document.getElementById("sheet").innerHTML=`<button class="btn" onclick="closeSheet(event)">×</button><h2>${i<0?"Add Task":"Edit Task"}</h2><label>Task Name</label><input id="n" value="${t[1]}" placeholder="e.g. Front flower bed"><label>Category</label><select id="c">${["Mowing","Weeding","Weed Eating","Other"].map(x=>`<option ${x===t[0]?"selected":""}>${x}</option>`).join("")}</select><label>Repeat</label><select id="r">${["Weekly","Every 2 weeks","Monthly","Seasonal","As needed"].map(x=>`<option ${x===t[2]?"selected":""}>${x}</option>`).join("")}</select><button class="save" onclick="save(${i})">SAVE TASK</button>`;
  document.getElementById("bg").style.display="flex";
}
function save(i){
  const c=document.getElementById("c").value;
  const n=document.getElementById("n").value.trim();
  const r=document.getElementById("r").value;
  if(!n)return;
  const existing=i>=0?tasks[i]:["Other","","Weekly","",""];
  const item=[c,n,r,existing[3]||"",existing[4]||""];
  if(i<0) tasks.push(item); else tasks[i]=item;
  persist();
  closeSheet();
  manage();
}
function complete(i){
  const task=tasks[i];
  if(!task) return;
  const completedDate=dateToISO(new Date());
  task[3]=completedDate;
  task[4]=getNextDueDate(task,completedDate);
  done.add(i);
  persist();
  renderCurrentView();
}
function undoComplete(i){
  const task=tasks[i];
  if(!task) return;
  done.delete(i);
  task[3]="";
  task[4]="";
  persist();
  renderCurrentView();
}
function closeSheet(e){
  if(e && e.target && e.target.id!="bg") return;
  document.getElementById("bg").style.display="none";
}
function calendar(){
  activeView='calendar';
  document.getElementById("screen").innerHTML=head("Calendar")+`<div class="main"><div class="card"><h3>September 2026</h3><p>14  15  16  17  18  <b>19</b>  20</p><p><b>21</b> 22  23  24  25  26  27</p></div><h2>Upcoming Tasks</h2><div class="card">${tasks.slice(0,6).map((t,i)=>row(t,i)).join("")}</div></div>`;
}
function mapView(){
  activeView='map';
  document.getElementById("screen").innerHTML=head("Yard Map")+`<div class="main"><div style="height:470px;border-radius:17px;background:linear-gradient(145deg,#b9d3aa,#dce7c8);position:relative"><b style="position:absolute;left:36%;bottom:10%;">Front Lawn</b><b style="position:absolute;right:12%;top:10%;">Back Lawn</b><b style="position:absolute;left:8%;top:30%;">Side Yard</b><b style="position:absolute;right:7%;top:55%;">Garden Beds</b></div></div>`;
}
home();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body></html>
