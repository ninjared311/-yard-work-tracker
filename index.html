<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yard Work Tracker</title>
<style>
body{margin:0;background:#e8eee9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173126}.app{max-width:390px;min-height:844px;margin:auto;background:#fff;position:relative}.status{height:32px;padding:8px 16px 0;font-weight:700;display:flex;justify-content:space-between}header{background:#167447;color:#fff;padding:16px 20px;display:flex;align-items:center}header h1{flex:1;margin:0;font-size:21px}.back{background:none;border:0;color:#fff;font-size:25px}.main{padding:16px 15px 24px}.main>p:first-child{margin-top:0;margin-bottom:8px}.stats,.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat,.cat,.card{border-radius:14px;padding:14px}.stat{text-align:center;background:#f2f7f3}.stat b{display:block;font-size:22px}.cat{border:0;color:#fff;text-align:left;min-height:80px;padding:10px 12px 9px;font-weight:800;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;box-shadow:0 12px 24px rgba(13,57,35,.12);transition:transform .12s ease, box-shadow .12s ease}.cat:active{transform:translateY(1px) scale(.99)}.mow{background:linear-gradient(135deg,#2d8757,#1d6f43)}.weed{background:linear-gradient(135deg,#5ca260,#3d8d4f)}.eat{background:linear-gradient(135deg,#eb8a42,#d86d25)}.other{background:linear-gradient(135deg,#67737a,#4e5c66)}.cat small{display:block;margin-top:4px;font-size:12px;opacity:.92}.card{border:1px solid #dfe8e2;margin:8px 0}.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e7eee9}.row:last-child{border:0}.grow{flex:1}.row-title{display:flex;align-items:center;gap:8px;font-weight:800}.row small{display:block;color:#718078;margin-top:4px;font-size:11px}.task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{display:inline-flex;align-items:center;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:700;background:#eef7f1;color:#1a5d3a}.chip.warn{background:#fff1df;color:#9a5c00}.chip.done{background:#e3f6e8;color:#0d6b3c}.btn{border:0;border-radius:8px;padding:7px 9px;font-weight:700}.green{background:#167447;color:#fff}.edit{background:#eef7f1;color:#167447}.delete-btn{background:#fff0f0;color:#bd3b3b;border:0;border-radius:8px;padding:10px 12px;font-weight:800;width:100%;margin:10px 0 0}.del{background:#fff0f0;color:#bd3b3b}.secondary{background:#f3f5f4;color:#3f4b44}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dfe8e2;display:flex;justify-content:space-around;padding:10px 0;z-index:2;max-width:390px;margin:0 auto}.nav button{border:0;background:none;color:#68736d}.nav .active{color:#167447;font-weight:800}.nav i{display:block;font-style:normal;font-size:20px}.fab{position:absolute;right:17px;bottom:80px;border:0;border-radius:50%;width:52px;height:52px;background:#167447;color:#fff;font-size:28px}.sheetbg{display:none;position:absolute;inset:0;background:rgba(0,0,0,.2);align-items:flex-start;justify-content:center;padding:16px;box-sizing:border-box}.sheet{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:330px;box-sizing:border-box;box-shadow:0 20px 40px rgba(0,0,0,.18);margin-top:12px}.sheet input,.sheet select,.sheet textarea{width:100%;padding:11px;margin:6px 0 13px;border:1px solid #dfe8e2;border-radius:9px;box-sizing:border-box}.save{width:100%;padding:13px;background:#167447;color:#fff;border:0;border-radius:10px;font-weight:800}.muted{color:#718078}.add-inline{float:right;margin-top:-3px}.task-icon{display:inline-flex;align-items:center;justify-content:center;min-width:18px;vertical-align:middle}.task-icon svg{display:block}.stats{display:flex;gap:10px}.stat{flex:1;min-width:0;padding:12px 8px}.stat b{font-size:18px}.stat{font-size:11px}.backup-actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.backup-actions .btn{flex:1;min-width:120px}.cat .task-icon{width:32px;height:32px;font-size:26px;line-height:1;display:inline-flex;align-items:center;justify-content:center}.cat .task-icon svg{width:32px;height:32px;display:block}.cat-title{font-size:15px;letter-spacing:.1px}.cat .cat-title,.cat small{width:100%;text-align:center}.date-field{position:relative;margin:6px 0 15px}.date-field label{display:block;color:#557064;font-size:12px;font-weight:700;margin-bottom:5px}.date-field input{width:100%;box-sizing:border-box;padding:12px 42px 12px 13px;border:1px solid #cfe0d4;border-radius:11px;background:#f8fbf9;color:#173126;font-size:15px}.date-field::after{content:"📅";position:absolute;right:13px;bottom:11px;pointer-events:none}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6b3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yard Work">
<link rel="apple-touch-icon" href="icon-192.png">
</head><body><div class="app"><div class="status"><span>9:41</span><span>●●● ▰</span></div><div id="screen"></div><div class="sheetbg" id="bg" onclick="closeSheet(event)"><div class="sheet" id="sheet" onclick="event.stopPropagation()"></div></div><div class="nav"><button class="active" onclick="home()"><i>⌂</i>Home</button><button onclick="manage()"><i>☑</i>Tasks</button><button onclick="calendar()"><i>📅</i>Calendar</button><button onclick="mapView()"><i>🗺</i>Yard Map</button></div></div>
<script>
const defaultTasks=[["Mowing","Front Lawn","Weekly"],["Mowing","Back Lawn","Weekly"],["Mowing","Side Yard","Every 2 weeks"],["Weeding","Garden Beds","Weekly"],["Weeding","Around Shrubs","Every 2 weeks"],["Weed Eating","Around House","Weekly"],["Weed Eating","Fence Lines","Every 2 weeks"],["Other","Trim Shrubs","Monthly"],["Other","Clean Gutters","Seasonal"],["Other","Leaf Cleanup","Fall"]];
let tasks=loadTasks(), done=loadDone();
let activeView='home';
function normalizeTask(task){
  const value=Array.isArray(task)?task:["Other","","Weekly"];
  const normalized=[value[0]||"Other",value[1]||"",value[2]||"Weekly"];
  normalized.push(value[3]||"");
  normalized.push(value[4]||"");
  return normalized;
}
function loadTasks(){
  try{
    const x=localStorage.getItem("yardWorkTasks");
    const parsed=x?JSON.parse(x):defaultTasks.map(t=>[...t]);
    return Array.isArray(parsed)?parsed.map(normalizeTask):defaultTasks.map(t=>[...t]);
  }catch(e){
    return defaultTasks.map(t=>[...t]);
  }
}
function loadDone(){
  try{return new Set(JSON.parse(localStorage.getItem("yardWorkDone")||"[]"));}catch(e){return new Set();}}
function persist(){
  localStorage.setItem("yardWorkTasks",JSON.stringify(tasks.map(normalizeTask)));
  localStorage.setItem("yardWorkDone",JSON.stringify([...done]));
}
function exportBackup(){
  const payload={version:1,exportedAt:new Date().toISOString(),tasks:tasks.map(normalizeTask),done:[...done]};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`yard-work-backup-${dateToISO(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function triggerImport(){
  document.getElementById("backupFileInput").click();
}
function importBackup(event){
  const file=event.target.files && event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const parsed=JSON.parse(String(e.target.result));
      if(!parsed || !Array.isArray(parsed.tasks)) throw new Error("Invalid backup");
      tasks=parsed.tasks.map(normalizeTask);
      done=new Set(Array.isArray(parsed.done)?parsed.done:[]);
      persist();
      manage();
    }catch(err){
      alert("That backup file could not be read.");
    }
    event.target.value="";
  };
  reader.readAsText(file);
}
const ic={Mowing:"custom",Weeding:"🌿","Weed Eating":"✂️",Other:"🔧"};
function mowerIcon(){
  return `<span class="task-icon" aria-label="Red zero-turn mower" title="Red zero-turn mower"><svg width="18" height="18" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img"><rect x="4" y="11" width="13" height="8" rx="2.4" fill="#d62c2c"/><rect x="15" y="13" width="9" height="6" rx="1.6" fill="#b61e1e"/><path d="M16 12L24 8" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round"/><path d="M6 11L10 6H17" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round"/><rect x="10" y="6" width="4" height="4" rx="1.1" fill="#d62c2c"/><circle cx="8" cy="23" r="3.2" fill="#1a1a1a"/><circle cx="21" cy="23" r="3.2" fill="#1a1a1a"/><path d="M2 10H5" stroke="#444" stroke-width="2" stroke-linecap="round"/><path d="M19 6H25" stroke="#444" stroke-width="2" stroke-linecap="round"/><path d="M13 8H18" stroke="#f4c7c7" stroke-width="1.8" stroke-linecap="round"/></svg></span>`;
}
function displayIcon(label){
  if(label === "Mowing") return mowerIcon();
  return ic[label] || "🔧";
}
function dateToISO(date){
  const year=date.getFullYear();
  const month=String(date.getMonth()+1).padStart(2,"0");
  const day=String(date.getDate()).padStart(2,"0");
  return `${year}-${month}-${day}`;
}
function formatLongDate(date){
  return new Intl.DateTimeFormat(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"}).format(date);
}
function parseDate(value){
  if(!value) return null;
  const date=new Date(value);
  return Number.isNaN(date.getTime())?null:date;
}
function formatDate(value){
  const date=parseDate(value);
  if(!date) return "";
  return date.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function formatDueDate(value){
  const date=parseDate(value);
  if(!date) return "";
  return date.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function addDays(date,days){
  const copy=new Date(date); copy.setDate(copy.getDate()+days); return copy;
}
function addMonths(date,months){
  const copy=new Date(date); copy.setMonth(copy.getMonth()+months); return copy;
}
function getNextDueDate(task,completedDate){
  const repeat=(task[2]||"Weekly").toLowerCase();
  const base=parseDate(completedDate)||new Date();
  if(!base) return "";
  switch(repeat){
    case "weekly": return dateToISO(addDays(base,7));
    case "every 2 weeks": return dateToISO(addDays(base,14));
    case "monthly": return dateToISO(addMonths(base,1));
    case "seasonal":
    case "spring & fall": return dateToISO(addMonths(base,6));
    case "as needed":
    case "fall":
    case "spring":
      return "";
    default: return "";
  }
}
function getTaskStatus(task){
  const last=task[3]; const next=task[4];
  if(!last && !next) return "New task";
  if(last && !next) return `Last completed ${formatDate(last)}`;
  if(next){
    const dueDate=parseDate(next);
    const today=new Date();
    const diff=Math.ceil((dueDate-today)/(1000*60*60*24));
    if(diff <= 0) return "Due today";
    if(diff === 1) return "Due tomorrow";
    return `Due in ${diff} days`;
  }
  return "Ready";
}
function renderCurrentView(){
  if(activeView==='manage') return manage();
  if(activeView==='calendar') return calendar();
  if(activeView==='map') return mapView();
  return home();
}
function head(x,b=true){return `<header>${b?'<button class="back" onclick="home()">‹</button>':''}<h1>${x}</h1></header>`}
function row(t,i){
  const itemIcon=displayIcon(t[0]);
  const lastCompleted=t[3] ? `<span class="chip">Last: ${formatDate(t[3])}</span>` : "";
  const nextDue=t[4] ? `<span class="chip ${done.has(i)?"done":"warn"}">Next: ${formatDueDate(t[4])}</span>` : "";
  const status=done.has(i)?'<span class="chip done">Completed</span>':'<span class="chip">'+getTaskStatus(t)+'</span>';
  const doneBtn=done.has(i) ? '<button class="btn secondary" onclick="undoComplete('+i+')">Undo</button>' : '<button class="btn green" onclick="complete('+i+')">Done</button>';
  return `<div class="row"><span class="grow"><div class="row-title"><span class="task-icon">${itemIcon}</span><span>${t[1]}</span></div><small>${t[0]} · ${t[2]}</small><div class="task-meta">${status}${lastCompleted}${nextDue}</div></span><button class="btn edit" onclick="edit(${i})">Edit</button>${doneBtn}</div>`;
}
function home(){
  activeView='home';
  const completedCount=done.size;
  const dueSoonCount=tasks.filter((t,i)=>!done.has(i) && t[4]).length;
  const cats=["Mowing","Weeding","Weed Eating","Other"];
  const todayLabel=formatLongDate(new Date());
  document.getElementById("screen").innerHTML=head("YARD WORK TRACKER",false)+`<div class="main"><p style="color:#718078">${todayLabel}</p><div class="stats"><div class="stat"><b>${dueSoonCount}</b><br>Due Soon</div><div class="stat"><b>${tasks.length}</b><br>Total Tasks</div><div class="stat"><b>${completedCount}</b><br>Completed</div></div><h2>Categories</h2><div class="cats">${cats.map(c=>`<button class="cat ${c=="Mowing"?"mow":c=="Weeding"?"weed":c=="Weed Eating"?"eat":"other"}" onclick="category('${c}')"><span class="task-icon">${displayIcon(c)}</span><span class="cat-title">${c}</span><small>${tasks.filter(t=>t[0]==c).length} tasks</small></button>`).join("")}</div><h2>Due Today</h2><div class="card">${tasks.map((t,i)=>[t,i]).filter(x=>!done.has(x[1]) && x[0][4]).slice(0,3).map(x=>row(x[0],x[1])).join("") || '<p class="muted">No tasks due right now.</p>'}</div></div>`;
}
function category(c){
  activeView='category';
  document.getElementById("screen").innerHTML=head(c)+`<div class="main"><h2>${displayIcon(c)} ${c}</h2><div class="card">${tasks.map((t,i)=>[t,i]).filter(x=>x[0][0]==c).map(x=>row(x[0],x[1])).join("")}</div></div>`;
}
function manage(){
  activeView='manage';
  document.getElementById("screen").innerHTML=head("Manage Tasks")+`<div class="main"><p style="color:#718078">Add, edit, or remove your yard-work duties.</p><div class="backup-actions"><button class="btn secondary" onclick="exportBackup()">Export Backup</button><button class="btn secondary" onclick="triggerImport()">Import Backup</button><input id="backupFileInput" type="file" accept=".json,application/json" style="display:none" onchange="importBackup(event)"></div>${["Mowing","Weeding","Weed Eating","Other"].map(c=>`<div class="card"><h3>${displayIcon(c)} ${c}<button class="btn green add-inline" onclick="addTask('${c}')">Add</button></h3>${tasks.map((t,i)=>[t,i]).filter(x=>x[0][0]==c).map(x=>row(x[0],x[1])).join("")}</div>`).join("")}</div>`;
}
function addTask(c="Mowing"){form(-1,[c,"","Weekly"])}
function edit(i){form(i,tasks[i])}
function form(i,t){
  const deleteButton=i>=0?`<button class="delete-btn" onclick="confirmDelete(${i})">Delete Task</button>`:"";
  document.getElementById("sheet").innerHTML=`<button class="btn" onclick="closeSheet()">×</button><h2>${i<0?"Add Task":"Edit Task"}</h2><label>Task Name</label><input id="n" value="${t[1]}" placeholder="e.g. Front flower bed"><label>Category</label><select id="c">${["Mowing","Weeding","Weed Eating","Other"].map(x=>`<option ${x===t[0]?"selected":""}>${x}</option>`).join("")}</select><label>Repeat</label><select id="r">${["Weekly","Every 2 weeks","Monthly","Seasonal","As needed"].map(x=>`<option ${x===t[2]?"selected":""}>${x}</option>`).join("")}</select><div class="date-field"><label for="last">Last Completed</label><input id="last" type="date" value="${t[3]||""}"></div><button class="save" onclick="save(${i})">SAVE TASK</button>${deleteButton}`;
  document.getElementById("bg").style.display="flex";
}
function confirmDelete(i){
  const task=tasks[i];
  if(!task) return;
  const confirmed=window.confirm(`Delete "${task[1]}"?`);
  if(!confirmed) return;
  tasks.splice(i,1);
  const remainingDone=new Set();
  for(const idx of done){
    if(idx < i) remainingDone.add(idx);
    if(idx > i) remainingDone.add(idx-1);
  }
  done=remainingDone;
  persist();
  closeSheet();
  manage();
}
function save(i){
  const c=document.getElementById("c").value;
  const n=document.getElementById("n").value.trim();
  const r=document.getElementById("r").value;
  const lastCompleted=document.getElementById("last").value;
  if(!n)return;
  const existing=i>=0?tasks[i]:["Other","","Weekly","",""];
  const item=[c,n,r,lastCompleted||"",""];
  if(lastCompleted){
    item[4]=getNextDueDate(item,lastCompleted);
  }
  if(i<0) tasks.push(item); else tasks[i]=item;
  if(lastCompleted){
    done.add(i>=0?i:tasks.length-1);
  }else if(i>=0){
    done.delete(i);
  }
  persist();
  closeSheet();
  manage();
}
function complete(i){
  const task=tasks[i];
  if(!task) return;
  const completedDate=dateToISO(new Date());
  task[3]=completedDate;
  task[4]=getNextDueDate(task,completedDate);
  done.add(i);
  persist();
  renderCurrentView();
}
function undoComplete(i){
  const task=tasks[i];
  if(!task) return;
  done.delete(i);
  task[3]="";
  task[4]="";
  persist();
  renderCurrentView();
}
function closeSheet(e){
  const bg=document.getElementById("bg");
  if(!bg) return;
  if(e && e.target && e.target.id !== "bg" && e.target !== bg){
    return;
  }
  bg.style.display="none";
}
function calendar(){
  activeView='calendar';
  document.getElementById("screen").innerHTML=head("Calendar")+`<div class="main"><div class="card"><h3>September 2026</h3><p>14  15  16  17  18  <b>19</b>  20</p><p><b>21</b> 22  23  24  25  26  27</p></div><h2>Upcoming Tasks</h2><div class="card">${tasks.slice(0,6).map((t,i)=>row(t,i)).join("")}</div></div>`;
}
function mapView(){
  activeView='map';
  document.getElementById("screen").innerHTML=head("Yard Map")+`<div class="main"><div style="height:470px;border-radius:17px;background:linear-gradient(145deg,#b9d3aa,#dce7c8);position:relative"><b style="position:absolute;left:36%;bottom:10%;">Front Lawn</b><b style="position:absolute;right:12%;top:10%;">Back Lawn</b><b style="position:absolute;left:8%;top:30%;">Side Yard</b><b style="position:absolute;right:7%;top:55%;">Garden Beds</b></div></div>`;
}
home();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body></html>
